# Configuración de Supabase para La Joya, guardada en archivo (en vez de clics en el panel).
# Se aplica a la nube con:   npx supabase config push
# y la usa también la nube local de pruebas:   npx supabase start
project_id = "la-joya"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "3MiB"

[auth]
enabled = true
# Dirección donde vive la app publicada (Cloudflare). Cámbiala si usas tu propio dominio.
site_url = "https://la-joya.workers.dev"
additional_redirect_urls = ["http://localhost:5173", "http://127.0.0.1:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Registro público cerrado: las cuentas del equipo las crea el dueño (Authentication → Add user).
# Antes, cualquiera con la llave pública podía crearse una cuenta (no veía datos, pero no debía poder).
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 10

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false
secure_password_change = true

[auth.rate_limit]
sign_in_sign_ups = 30
token_refresh = 150

# Funciones: validan el acceso por dentro (secreto de Vault, token de la unidad o cuenta de admin)
[functions.push-send]
verify_jwt = false

[functions.ical-sync]
verify_jwt = false

[functions.ical-export]
verify_jwt = false

# Hospedaje: «reservar» es pública a propósito (la llama la web sin cuenta; la cuidan Turnstile
# y el límite por dirección de internet). «avisos-hospedaje» revisa por dentro el secreto de Vault.
[functions.reservar]
verify_jwt = false

[functions.avisos-hospedaje]
verify_jwt = false

[edge_runtime]
enabled = true
policy = "per_worker"
