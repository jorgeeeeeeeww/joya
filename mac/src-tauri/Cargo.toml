[package]
name = "la-joya-reservaciones"
version = "0.1.0"
description = "La Joya · Reservaciones: la app del dueño para la Mac"
authors = ["Jardines La Joya"]
edition = "2021"
rust-version = "1.90"

[lib]
# El nombre lleva «_lib» para que no choque con el del programa en Windows
name = "la_joya_lib"
crate-type = ["lib"]

# Cada versión va amarrada a la misma «2.x» que el paquete de npm con su mismo nombre:
# la compilación de Tauri se detiene si el código de Rust y el de npm no coinciden.
[build-dependencies]
tauri-build = { version = "~2.7", features = [] }

[dependencies]
# Lo usa el código que genera tauri::generate_context!
serde_json = "1"
tauri = { version = "~2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "~2.7"
tauri-plugin-notification = "~2.8"
tauri-plugin-opener = "~2.7"
tauri-plugin-process = "~2.4"
tauri-plugin-single-instance = "~2.5"
tauri-plugin-updater = "~2.14"
tauri-plugin-window-state = "~2.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
